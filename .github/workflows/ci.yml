name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"

# Read-only by default; nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test -- --runInBand

      - name: Build
        run: pnpm run build

      - name: Validate Deployments
        run: pnpm run validate:deployments

      - name: Check Package Exports
        run: pnpm run check:exports

      - name: Check Package Imports
        run: pnpm run check:imports

      # Builds every entry payload against live fullnodes and reads every view the
      # clients use. The unit tests assert payload shape only and never build a
      # transaction, which is how unsubmittable payloads shipped in v1.1.0.
      #
      # Split by chain because the legs do not deserve equal authority. movement-mainnet is
      # the leading chain — the only one binding every optional ABI (canopyHelpers,
      # canopyRewardsView, meridianBatchViews) — and it reaches zero skips, so it runs
      # --strict, where a skip is a failure. That is what stops coverage vanishing silently:
      # an emptied registry drops eight checks behind a single early return.
      #
      # The other legs cannot be strict, because each has skips that are genuinely correct.
      # aptos-testnet has no Meridian deployment, and aptos-mainnet's Meridian registry is
      # empty (3 passes, 3 skips). Payload failures and unreachable-chain errors still gate
      # on aptos-testnet.
      - name: Check Live Payloads And Views (movement-mainnet, leading chain)
        run: pnpm run check:payloads -- --chain=movement-mainnet --strict

      # Curator is movement-testnet-only. It must not count as missing mainnet coverage,
      # but it still needs a live payload/view gate on the chain where it exists.
      #
      # Non-strict for the same reason: this chain deploys curator alone, so canopy,
      # rewards and Meridian all skip correctly here. --strict would need an allowlist for
      # those three. Instead the curator sweep itself refuses to be skipped — a missing
      # client or fixture is a failure in checkCurator, so this leg cannot pass having
      # checked nothing, which is the one thing --strict was protecting elsewhere.
      - name: Check Live Payloads And Views (movement-testnet, curator)
        run: pnpm run check:payloads -- --chain=movement-testnet

      - name: Check Live Payloads And Views (aptos-testnet)
        run: pnpm run check:payloads -- --chain=aptos-testnet

      # Informational only. Movement mainnet already covers the same Meridian builders, so
      # gating merges on Aptos mainnet RPC availability buys ~3 extra passes and costs a
      # third-party dependency in the merge path.
      - name: Check Live Payloads And Views (aptos-mainnet, informational)
        run: pnpm run check:payloads -- --chain=aptos-mainnet
        continue-on-error: true

      # Surf pulled @initia/initia.js in from its main entry, which needs Node's
      # Buffer and killed the SDK in any browser. Unit tests run in Node, so nothing
      # caught it; this builds the example app and greps the output.
      - name: Build Example App
        run: pnpm --filter @canopy-sdk-example/sdk-react run build

      - name: Check Browser Bundle
        run: pnpm run check:bundle

      - name: Check Local ABI Files
        run: pnpm run abi:check-local

      - name: Check Movement Mainnet ABI Drift
        run: pnpm run abi:check -- --chain=movement-mainnet

      - name: Check Movement Testnet ABI Drift
        run: pnpm run abi:check -- --chain=movement-testnet

      - name: Check Aptos Testnet ABI Drift
        run: pnpm run abi:check -- --chain=aptos-testnet

      - name: Check Aptos Mainnet ABI Drift
        run: pnpm run abi:check -- --chain=aptos-mainnet

  abi-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Detects ABI drift at the addresses pinned in packages/deployments/addresses.
      # It does not detect redeploys to new addresses; that needs an external source of
      # truth for current deployments. Additive in-place drift still matters because CLI
      # management tooling relies on complete checked-in ABIs, not only SDK client methods.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Local ABI Files
        run: pnpm run abi:check-local

      - name: Check Movement Mainnet ABI Drift
        run: pnpm run abi:check -- --chain=movement-mainnet

      - name: Check Movement Testnet ABI Drift
        run: pnpm run abi:check -- --chain=movement-testnet

      - name: Check Aptos Testnet ABI Drift
        run: pnpm run abi:check -- --chain=aptos-testnet

      - name: Check Aptos Mainnet ABI Drift
        run: pnpm run abi:check -- --chain=aptos-mainnet
